[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evo-utils"
version = "0.1.0"
description = "Shared Python utilities for Evolutek robots"
requires-python = ">=3.14"
dependencies = [
    "pyjson5>=1.6",
    "json5>=0.13",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "opencv-contrib-python>=4.10",
    "evo-hl-library",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
calibrate-camera = "evo_utils.cli.calibrate_camera:main"

# Path source for local sibling worktree. The library is consumed editable
# so changes in evo_hl_library-camera/ are picked up without re-sync.
[tool.uv.sources]
evo-hl-library = { path = "../evo_hl_library-camera", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/evo_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
